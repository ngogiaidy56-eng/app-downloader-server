<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard VIP PRO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-vip">

    <div class="glow-bg"></div>

    <div id="loginOverlay" class="modal-overlay">
        <div class="modal-content-vip" style="max-width: 400px; text-align: center;">
            <h2 style="margin-bottom: 1rem;"><i class="fa-solid fa-lock text-gold"></i> Admin VIP Login</h2>
            <input type="password" id="adminPassword" placeholder="Mật khẩu (admin123)..." class="input-vip" style="margin-bottom: 1rem;">
            <button onclick="loginAdmin()" class="btn-download-vip w-100"><i class="fa-solid fa-key"></i> Đăng Nhập</button>
        </div>
    </div>

    <header class="header-vip">
        <div class="header-container">
            <div class="logo-vip">
                <i class="fa-solid fa-user-shield crown-icon"></i>
                <span class="logo-text">AppStore <span class="badge-pro">ADMIN VIP</span></span>
            </div>
            <div>
                <a href="index.html" class="btn-glass" style="text-decoration:none;"><i class="fa-solid fa-globe"></i> Trang Chủ</a>
                <button onclick="logoutAdmin()" class="btn-glass" style="color: #ef4444;"><i class="fa-solid fa-power-off"></i> Thoát</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="admin-stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-box-archive stat-icon text-cyan"></i>
                <div><h3 id="statTotalApps">0</h3><p>Tổng phần mềm</p></div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-cloud-arrow-down stat-icon text-gold"></i>
                <div><h3 id="statTotalDownloads">0</h3><p>Tổng lượt tải</p></div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-hard-drive stat-icon text-purple"></i>
                <div><h3 id="statTotalStorage">0 MB</h3><p>Dung lượng</p></div>
            </div>
        </section>

        <section class="admin-section">
            <h3><i class="fa-solid fa-cloud-arrow-up text-cyan"></i> Tải Lên Phần Mềm Mới</h3>
            <form id="uploadForm" class="upload-form-vip">
                <div class="form-row">
                    <input type="text" id="appName" placeholder="Tên phần mềm *" required class="input-vip">
                    <input type="text" id="appVersion" placeholder="Phiên bản (v1.0.0)" required class="input-vip">
                </div>
                <div class="form-row">
                    <select id="appCategory" class="input-vip">
                        <option value="Windows">Windows (.exe, .zip)</option>
                        <option value="Android">Android (.apk)</option>
                        <option value="Tools">Công cụ AI / Tool</option>
                    </select>
                    <input type="text" id="appRating" placeholder="Đánh giá (5.0)" class="input-vip">
                </div>
                <textarea id="appDescription" placeholder="Mô tả..." rows="2" class="input-vip"></textarea>
                <textarea id="appChangelog" placeholder="Changelog..." rows="2" class="input-vip"></textarea>

                <div class="file-drop-zone" id="dropZone">
                    <i class="fa-solid fa-file-zipper drop-icon"></i>
                    <p>Kéo & thả file hoặc <strong>Bấm vào đây để chọn file</strong></p>
                    <input type="file" id="softwareFile" required hidden>
                    <span id="selectedFileName" class="selected-file-name"></span>
                </div>

                <button type="submit" class="btn-download-vip w-100" style="margin-top: 1rem;">
                    <i class="fa-solid fa-upload"></i> ĐĂNG LÊN SERVER
                </button>
            </form>
        </section>

        <section class="admin-section">
            <h3><i class="fa-solid fa-list-check text-gold"></i> Quản Lý File Trên Server</h3>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Tên Ứng Dụng</th>
                            <th>Phiên Bản</th>
                            <th>Danh Mục</th>
                            <th>Dung Lượng</th>
                            <th>Lượt Tải</th>
                            <th>Đường Dẫn</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="adminAppTable"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="toastContainer" class="toast-container-vip"></div>
    <script src="script.js"></script>
</body>
</html>

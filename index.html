<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppStore VIP PRO - Kho Phần Mềm & Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-vip">

    <div class="glow-bg"></div>

    <!-- Header VIP -->
    <header class="header-vip">
        <div class="header-container">
            <div class="logo-vip">
                <i class="fa-solid fa-crown crown-icon"></i>
                <span class="logo-text">AppStore <span class="badge-pro">VIP PRO</span></span>
            </div>
            
            <div class="search-vip">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm siêu tốc ứng dụng, game, công cụ...">
            </div>

            <!-- User Status & Nút Chuyển Bảng Admin -->
            <div class="user-vip-status">
                <div class="vip-points">
                    <i class="fa-solid fa-gem gem-icon"></i> <span id="userPoints">1,250</span> PTS
                </div>
                <button class="btn-admin-toggle" onclick="toggleAdminPanel()">
                    <i class="fa-solid fa-user-shield"></i> <span id="adminToggleText">Quản Trị Admin</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content (User View) -->
    <main class="main-content" id="userView">
        <section class="hero-vip">
            <div class="hero-content">
                <span class="hero-tag"><i class="fa-solid fa-fire"></i> EXCLUSIVE PLATFORM</span>
                <h2>KHO PHẦN MỀM THƯỢNG HẠNG</h2>
                <p>Quản lý và tải phần mềm tốc độ cực đại.</p>
            </div>

            <div class="controls-vip">
                <div class="filter-tags">
                    <button class="tag-btn active" data-filter="all"><i class="fa-solid fa-border-all"></i> Tất cả</button>
                    <button class="tag-btn" data-filter="Windows"><i class="fa-brands fa-windows"></i> Windows</button>
                    <button class="tag-btn" data-filter="Android"><i class="fa-brands fa-android"></i> Android</button>
                    <button class="tag-btn" data-filter="Tools"><i class="fa-solid fa-screwdriver-wrench"></i> Tools AI</button>
                </div>
            </div>
        </section>

        <!-- Dynamic App Grid -->
        <section class="app-grid" id="appGrid"></section>
    </main>

    <!-- TÍNH NĂNG MỚI: BẢNG QUẢN TRỊ ADMIN CONTROL PANEL -->
    <section class="admin-panel hidden" id="adminPanel">
        <div class="admin-container">
            <div class="admin-header">
                <h2><i class="fa-solid fa-gears text-gold"></i> Admin Dashboard - Quản Lý Phần Mềm</h2>
                <button class="btn-add-app" onclick="openAppFormModal()"><i class="fa-solid fa-plus"></i> Thêm Phần Mềm Mới</button>
            </div>

            <!-- Thống kê nhanh Admin -->
            <div class="admin-stats-grid">
                <div class="stat-card">
                    <i class="fa-solid fa-cubes icon-purple"></i>
                    <div><h3 id="statTotalApps">0</h3><p>Tổng phần mềm</p></div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-cloud-arrow-down icon-cyan"></i>
                    <div><h3 id="statTotalDownloads">24,500</h3><p>Tổng lượt tải</p></div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-crown icon-gold"></i>
                    <div><h3>VIP Active</h3><p>Trạng thái máy chủ</p></div>
                </div>
            </div>

            <!-- Bảng Danh Sách Ứng Dụng (CRUD Table) -->
            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Icon</th>
                            <th>Tên phần mềm</th>
                            <th>Danh mục</th>
                            <th>Phiên bản</th>
                            <th>Link Tải</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="adminAppTableBody">
                        <!-- Render từ JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- MODAL THÊM / SỬA PHẦN MỀM (FORM CRUD) -->
    <div id="appFormModal" class="modal-overlay hidden">
        <div class="modal-content-vip">
            <button class="modal-close" onclick="closeAppFormModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="formModalTitle" style="margin-bottom: 1rem;"><i class="fa-solid fa-pen-to-square text-gold"></i> Thêm Phần Mềm Mới</h3>
            
            <form id="appCrudForm" class="crud-form">
                <input type="hidden" id="appFormId">
                <div class="form-group">
                    <label>Tên phần mềm:</label>
                    <input type="text" id="formTitle" required placeholder="Ví dụ: Screen OCR Utility">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Danh mục:</label>
                        <select id="formCategory">
                            <option value="Windows">Windows</option>
                            <option value="Android">Android</option>
                            <option value="Tools">Tools AI / Automation</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Phiên bản / Dung lượng:</label>
                        <input type="text" id="formVersion" required placeholder="v1.0.0 • 45 MB">
                    </div>
                </div>
                <div class="form-group">
                    <label>Mô tả ngắn:</label>
                    <textarea id="formDescription" rows="2" placeholder="Nhập mô tả tính năng..."></textarea>
                </div>
                <div class="form-group">
                    <label>Đường dẫn Tải về (URL / GitHub Releases / Local):</label>
                    <input type="text" id="formDownloadUrl" required placeholder="downloads/app.exe hoặc https://cloud.com/file">
                </div>
                <div class="form-group">
                    <label>Icon (FontAwesome Class hoặc URL ảnh):</label>
                    <input type="text" id="formIconClass" placeholder="fa-solid fa-robot">
                </div>
                <button type="submit" class="btn-download-vip w-100" style="margin-top: 1rem;">LƯU PHẦN MỀM</button>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container-vip"></div>

    <script src="script.js"></script>
</body>
</html>

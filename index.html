<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppStore VIP PRO - GitHub Pages</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-vip">

    <div class="glow-bg"></div>

    <header class="header-vip">
        <div class="header-container">
            <div class="logo-vip">
                <i class="fa-solid fa-crown crown-icon"></i>
                <span class="logo-text">AppStore <span class="badge-pro">VIP PRO</span></span>
            </div>
            <div class="search-vip">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm ứng dụng, công cụ...">
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="hero-vip">
            <div class="hero-content">
                <span class="hero-tag"><i class="fa-solid fa-fire"></i> GITHUB PAGES STATIC HOSTING</span>
                <h2>KHO PHẦN MỀM THƯỢNG HẠNG</h2>
                <p>Tải xuống ứng dụng an toàn và tốc độ cao trực tiếp từ GitHub.</p>
            </div>
        </section>

        <section class="app-grid" id="appGrid">
            <!-- Dữ liệu được load động bằng JavaScript -->
        </section>
    </main>

    <div id="toastContainer" class="toast-container-vip"></div>
    <script src="script.js"></script>
</body>
</html>
